name: Injecter le SHA256 dans les notes de release

# A chaque release publiee, calcule le SHA256 de l'archive source et l'ajoute
# automatiquement dans les notes sous forme "sha256: <hash>".
# L'application verifie ce hash au telechargement de la mise a jour.
# 100% automatique : aucune action manuelle requise.
# Le declenchement manuel (workflow_dispatch) permet de (re)traiter un tag existant.

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release a traiter (ex: 4.9.8)"
        required: true

permissions:
  contents: write

jobs:
  sha256:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier que src/Version.ps1 correspond au tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          RAW=$(gh api "repos/$REPO/contents/src/Version.ps1?ref=$TAG" -q .content | base64 -d)
          VER=$(printf '%s' "$RAW" | grep -oE "[0-9]+\.[0-9]+\.[0-9]+" | head -n1)
          CLEAN_TAG="${TAG#v}"
          echo "Version.ps1 = $VER | tag = $CLEAN_TAG"
          if [ "$VER" != "$CLEAN_TAG" ]; then
            echo "::error::src/Version.ps1 ($VER) ne correspond pas au tag ($CLEAN_TAG). L'auto-updater comparerait des versions incoherentes."
            exit 1
          fi

      - name: Calculer et injecter le SHA256
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Traitement du tag: $TAG"

          # Recupere les notes actuelles
          BODY=$(gh release view "$TAG" --repo "$REPO" --json body -q .body)

          # Si un hash est deja present, on ne fait rien (evite une boucle sur "edited")
          if printf '%s' "$BODY" | grep -qiE '^[[:space:]]*sha256[[:space:]]*[:=]'; then
            echo "SHA256 deja present dans les notes, rien a faire."
            exit 0
          fi

          # Telecharge l'archive source EXACTE que l'application ira chercher (zipball_url)
          curl -sSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/zipball/$TAG" -o release.zip

          HASH=$(sha256sum release.zip | cut -d' ' -f1)
          echo "SHA256 = $HASH"

          # Ajoute la ligne a la fin des notes existantes
          NEWBODY=$(printf '%s\n\nsha256: %s\n' "$BODY" "$HASH")
          gh release edit "$TAG" --repo "$REPO" --notes "$NEWBODY"
          echo "Notes de release mises a jour."
